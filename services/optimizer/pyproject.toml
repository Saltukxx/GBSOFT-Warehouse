[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gbsoft-optimizer"
version = "0.1.0"
description = "GBSoft deterministic CP-SAT slotting optimizer"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "ortools>=9.10,<10",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
